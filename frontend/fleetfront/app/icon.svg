<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" fill="#0A1128" rx="96"/>

  <!-- Stylized F lettermark with motion lines -->
  <!-- Main vertical stem -->
  <rect x="140" y="128" width="44" height="256" fill="#C5A059" rx="4"/>

  <!-- Top horizontal bar (full) -->
  <rect x="140" y="128" width="220" height="44" fill="#C5A059" rx="4"/>

  <!-- Middle horizontal bar (shorter — classic F) -->
  <rect x="140" y="232" width="160" height="38" fill="#C5A059" rx="4"/>

  <!-- Subtle speed/motion accent lines (right side) -->
  <rect x="320" y="316" width="52" height="10" fill="#C5A059" rx="5" opacity="0.5"/>
  <rect x="340" y="334" width="32" height="10" fill="#C5A059" rx="5" opacity="0.3"/>
  <rect x="310" y="298" width="22" height="10" fill="#C5A059" rx="5" opacity="0.2"/>
</svg>
